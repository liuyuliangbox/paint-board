worker_processes  auto;
events {
  worker_connections  1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  add_header 'Access-Control-Allow-Origin' '*';

  server {
    listen 80;
    root /usr/share/nginx/html/dist;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
