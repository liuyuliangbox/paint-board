name: Deploy widget sync Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/widget-sync/**'
      - '.github/workflows/deploy-widget-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-widget-sync
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy-worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Worker
        working-directory: workers/widget-sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Avoid local npm peer conflicts; match Pages deploy style.
        run: npx --yes wrangler@4.28.0 deploy
